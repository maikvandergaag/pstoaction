# Stage 3 proof #1: the logic is tested, on every platform, on every push.
#
# Stage 1 had no tests. Stage 2 could only be verified by pushing and
# watching. This is the difference.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) {
            Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          (Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version

      - name: Run the test suite
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $false
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "testresults-${{ matrix.os }}.xml"

          $result = Invoke-Pester -Configuration $config

          $icon = if ($result.FailedCount -eq 0) { '✅' } else { '❌' }
          @(
            "## $icon Tests on ${{ matrix.os }}"
            ''
            "**$($result.PassedCount)/$($result.TotalCount)** passed in $([math]::Round($result.Duration.TotalSeconds, 1))s."
          ) -join "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) test(s) failed."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresults-${{ matrix.os }}
          path: testresults-*.xml
          if-no-files-found: ignore

  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyse
        shell: pwsh
        run: |
          # stages/ is deliberately imperfect — it is the "before" picture.
          $paths = @('./src', './scripts', './tests')

          $findings = @(
            foreach ($path in $paths) {
              Invoke-ScriptAnalyzer -Path $path -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
            }
          )

          foreach ($f in $findings) {
            $level = if ($f.Severity -eq 'Error') { 'error' } else { 'warning' }
            Write-Host "::${level} file=$($f.ScriptPath),line=$($f.Line),title=$($f.RuleName)::$($f.Message)"
          }

          $errors = @($findings | Where-Object Severity -eq 'Error')
          Write-Host "$($findings.Count) finding(s), $($errors.Count) error(s)."

          if ($errors.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($errors.Count) error(s)."
          }

  dogfood:
    name: The action checks this repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The clearest argument for shipping an action: we consume our own
      # contract exactly the way another team would.
      - name: Check repository standards
        uses: ./
        with:
          required-files: |
            README.md
            LICENSE
            .gitignore
            action.yml
          required-readme-sections: |
            Usage
            Inputs
            Outputs
            Support
          forbidden-patterns: |
            *.pfx
            *.pem
