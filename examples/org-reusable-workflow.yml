# The next level of sharing: an organisation-wide reusable workflow that
# wraps the action and encodes the ORGANISATION'S policy.
#
# Teams then write three lines instead of twenty, and the policy itself
# can be updated centrally.
#
# Place this in your-org/.github/.github/workflows/repo-standards.yml

name: Org repository standards

on:
  workflow_call:
    inputs:
      profile:
        description: Which standards profile to apply. 'baseline' or 'production'.
        type: string
        required: false
        default: baseline
      fail-on-error:
        type: boolean
        required: false
        default: true
    outputs:
      result:
        description: '"passed" or "failed".'
        value: ${{ jobs.standards.outputs.result }}

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.standards.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the organisation profile
        id: profile
        shell: pwsh
        run: |
          $baseline = @('README.md', 'LICENSE', '.gitignore')
          $production = $baseline + @('.github/CODEOWNERS', 'SECURITY.md')

          $files = if ('${{ inputs.profile }}' -eq 'production') { $production } else { $baseline }

          $delimiter = "eof_$([guid]::NewGuid().ToString('N'))"
          "files<<$delimiter"        | Out-File $env:GITHUB_OUTPUT -Append
          ($files -join "`n")        | Out-File $env:GITHUB_OUTPUT -Append
          $delimiter                 | Out-File $env:GITHUB_OUTPUT -Append

      - name: Check repository standards
        id: standards
        uses: your-org/repo-standards-action@v1
        with:
          required-files: ${{ steps.profile.outputs.files }}
          required-readme-sections: Usage
          forbidden-patterns: |
            *.pfx
            *.pem
          fail-on-error: ${{ inputs.fail-on-error }}

# -----------------------------------------------------------------------
# A consuming team then only writes:
#
#   jobs:
#     standards:
#       uses: your-org/.github/.github/workflows/repo-standards.yml@v1
#       with:
#         profile: production
# -----------------------------------------------------------------------
