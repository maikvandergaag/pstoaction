# Copy this into any repository as .github/workflows/standards.yml
#
# This is what a consuming team writes. Note what is NOT here:
# no PowerShell, no copied script, no knowledge of how the check works.

name: Repository standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check repository standards
        id: standards
        uses: your-org/repo-standards-action@v1
        with:
          required-files: |
            README.md
            LICENSE
            .gitignore
            .github/CODEOWNERS
          required-readme-sections: |
            Usage
            Support
          forbidden-patterns: |
            *.pfx
            *.pem
            appsettings.local.json

      # Outputs let you build on the result instead of just failing.
      - name: Comment on the pull request when something is missing
        if: always() && steps.standards.outputs.result == 'failed' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.standards.outputs.report-json }}
        with:
          script: |
            const report = JSON.parse(process.env.REPORT);
            const failed = report.Checks.filter(c => !c.Passed);
            const body = [
              '### ❌ Repository standards',
              '',
              ...failed.map(c => `- \`${c.Category}\` **${c.Name}** — ${c.Message}`),
              '',
              '_Generated by `repo-standards-action`._'
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });
